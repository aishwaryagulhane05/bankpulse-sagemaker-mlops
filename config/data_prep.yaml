# Data preparation config: data source, split fractions, and which features (and versions) are enabled
#
# Local paths are relative to the repository root, so the same file works from the repo
# root, from notebooks/ and from tests. S3 locations are added in Phase 4 (BP-403).
# No credentials, account IDs or secrets belong in this file.

# Raw input file and how to read it.
data:
  path: data/raw/bank-additional-full.csv
  separator: ";"

# Data contract the input must satisfy (columns, types, rules, target, leakage).
contract: config/contract.yaml

# Time-ordered split: rows keep their date order, oldest rows train the model.
# Fractions must add up to 1.
split:
  train: 0.70
  validation: 0.15
  test: 0.15

# Where the pipeline writes its outputs.
output:
  processed_dir: data/processed
  reports_dir: reports

# Log level for setup_logging(): DEBUG, INFO, WARNING or ERROR.
log_level: INFO

# Enabled features, as name: version, in output column order. Each pair must be registered
# by a module in features/. To upgrade a feature, change its version here (e.g. v1 -> v2);
# the pipeline code doesn't change.
features:
  # Contact history (features/contact_history.py)
  previously_contacted: v1
  prior_success: v1
  previous_contacts: v1
  # Campaign (features/campaign.py)
  campaign_intensity: v1
  capped_campaign: v1
  # Economic indicators (features/economic.py) - time-dependent, watch for drift
  euribor_rate: v1
  employment_level: v1
  economic_indicators: v1
  # Client profile and contact timing (features/client_profile.py)
  age: v1
  age_band: v1
  categorical_profile: v1
  contact_timing: v1
